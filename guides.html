<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZE Documentation — Video Player</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Engine Engine (Required for aspect-video and layout sizing) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#0a0a0a',
              mist: '#f4f4f0',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>

    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        color: #f4f4f0;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }

      ::selection { background: #f4f4f0; color: #0a0a0a; }

      /* Layer 5: Placed above dark grid background (z-0) and below main UI card (z-10) */
      #matrixCanvas {
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100lvh;
        z-index: 5;
        pointer-events: none;
        opacity: 0.55;
      }

      .grid-bg {
        background-image: linear-gradient(to right, rgba(255, 255, 255, 0.045) 1px, transparent 1px), 
                          linear-gradient(to bottom, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 72px 72px;
      }
    </style>
</head>
<body class="relative flex items-center justify-center min-h-screen p-4 sm:p-8">

    <!-- Layer 0: Background Grid -->
    <div class="pointer-events-none fixed inset-0 z-0 overflow-hidden bg-ink">
      <div class="grid-bg absolute inset-0 opacity-35 [mask-image:linear-gradient(to_bottom,black,transparent_82%)]"></div>
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_20%,rgba(10,10,10,0.95)_80%)]"></div>
      <div class="absolute inset-x-0 top-0 h-px bg-white/20"></div>
    </div>

    <!-- Layer 5: Digital Matrix Rain Canvas -->
    <canvas id="matrixCanvas" aria-hidden="true"></canvas>

    <!-- Layer 100: Custom Interactive Pointer -->
    <div id="custom-cursor" class="pointer-events-none fixed left-0 top-0 z-[100] hidden mix-blend-difference md:block transition-transform duration-75 ease-out">
      <div id="cursor-inner" class="-translate-x-1/2 -translate-y-1/2 rounded-full border border-white bg-white/10 transition-all duration-200" style="width: 42px; height: 42px;"></div>
    </div>

    <!-- Layer 10: Centered Video Player Container -->
    <main class="relative z-10 w-full max-w-4xl border border-white/15 bg-ink/85 p-4 sm:p-6 backdrop-blur-xl shadow-[0_12px_40px_rgba(0,0,0,0.6)]">
      
      <!-- Minimal Header Bar -->
      <div class="mb-4 flex items-center justify-between border-b border-white/15 pb-3 font-mono text-[11px] uppercase tracking-[0.16em] text-mist/50">
        <span class="flex items-center gap-2">
          <span class="h-1.5 w-1.5 rounded-full bg-mist animate-ping"></span>
          Media Player
        </span>
        <span>GitHub Stream</span>
      </div>

      <!-- Video Element -->
      <div class="relative aspect-video w-full overflow-hidden bg-black border border-white/10">
        <video 
          controls 
          autoplay 
          playsinline
          preload="metadata" 
          class="h-full w-full object-contain"
        >
          <!-- Replace this source URL with your direct raw MP4 GitHub file URL -->
          <!-- Example GitHub raw format: https://raw.githubusercontent.com/username/repository/main/video.mp4 -->
          <source src="https://raw.githubusercontent.com/username/repository/main/video.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>

    </main>

    <!-- Cursor Script -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const cursor = document.getElementById('custom-cursor');
        const cursorInner = document.getElementById('cursor-inner');

        if (cursor && window.innerWidth >= 768) {
          window.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
          });

          document.querySelectorAll('video, button, a').forEach((el) => {
            el.addEventListener('mouseenter', () => {
              if (cursorInner) {
                cursorInner.style.width = '64px';
                cursorInner.style.height = '64px';
                cursorInner.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
              }
            });
            el.addEventListener('mouseleave', () => {
              if (cursorInner) {
                cursorInner.style.width = '42px';
                cursorInner.style.height = '42px';
                cursorInner.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
              }
            });
          });
        }
      });
    </script>

    <!-- Matrix Rain Script -->
    <script id="digital-rain">
    (function () {
      'use strict';
      var RAIN = { enabled: true, density: 100, speed: 100, brightness: 50, trail: 100, mirror: true };
      var COLOR = '#ffffff';
      var FONT_STACK = '"MS Gothic","Osaka-Mono","Noto Sans Mono CJK JP","Noto Sans JP","Yu Gothic","MS Mincho",monospace';
      var FONT_SIZE = 16, COL_W = 14, ROW_H = 17;

      var canvas = document.getElementById('matrixCanvas');
      var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
      if (!ctx || !RAIN.enabled) { if (canvas) canvas.style.display = 'none'; return; }
      canvas.style.opacity = String(RAIN.brightness / 100);

      function hexToRgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
      function mix(rgb, t) { return rgb.map(function (c) { return Math.round(c + (255 - c) * t); }); }
      var base = hexToRgb(COLOR);
      var baseStr = 'rgb(' + base.join(',') + ')';
      var neckStr = 'rgb(' + mix(base, 0.35).join(',') + ')';
      var headStr = 'rgb(' + mix(base, 0.85).join(',') + ')';

      var KANA = [], DIGITS = '0123456789'.split(''), SYMBOLS = ':.=*+-<>\u00a6|'.split('');
      for (var code = 0xFF66; code <= 0xFF9D; code++) KANA.push(String.fromCharCode(code));
      function glyph() {
        var r = Math.random();
        if (r < 0.72) return KANA[(Math.random() * KANA.length) | 0];
        if (r < 0.93) return DIGITS[(Math.random() * DIGITS.length) | 0];
        return SYMBOLS[(Math.random() * SYMBOLS.length) | 0];
      }

      var stableW = 0, stableH = 0;
      function getSize() {
        var w = window.innerWidth, h = window.innerHeight;
        if (w !== stableW) { stableW = w; stableH = h; } else if (h > stableH) { stableH = h; }
        return { w: w, h: stableH };
      }

      var dpr = 1, rows = 0, colW = COL_W, streams = [], last = 0;

      function newStream(initial) {
        var len = Math.round((10 + ((Math.random() * Math.min(rows * 0.8, 34)) | 0)) * RAIN.trail / 100);
        len = Math.max(4, Math.min(len, rows + 6));
        var glyphs = [];
        for (var r = 0; r <= rows; r++) glyphs.push(glyph());
        return {
          head: initial ? Math.random() * (rows + len) - len * 0.4 : -(Math.random() * rows * 0.9),
          speed: 6 + Math.random() * 14,
          len: len, glyphs: glyphs
        };
      }

      function resize() {
        var size = getSize();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(size.w * dpr));
        canvas.height = Math.max(1, Math.round(size.h * dpr));
        rows = Math.ceil(size.h / ROW_H) + 1;
        colW = Math.min(70, Math.max(9, COL_W * 100 / RAIN.density));
        streams = [];
        for (var i = 0, cols = Math.ceil(size.w / colW); i < cols; i++) streams.push(newStream(true));
      }

      function put(ch, row) { ctx.fillText(ch, 0, row * ROW_H * dpr); }

      function frame(t) {
        window.requestAnimationFrame(frame);
        if (document.hidden || t - last < 32) return;
        var dt = Math.min((t - last) / 1000, 0.1);
        last = t;
        var size = getSize();
        if (size.w < 2 || size.h < 2) return;
        if (canvas.width !== Math.round(size.w * dpr) || canvas.height !== Math.round(size.h * dpr)) resize();

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = (FONT_SIZE * dpr) + 'px ' + FONT_STACK;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        var speedFactor = RAIN.speed / 100;

        for (var i = 0; i < streams.length; i++) {
          var s = streams[i];
          s.head += s.speed * speedFactor * dt;
          if (Math.random() < 0.3) s.glyphs[(Math.random() * s.glyphs.length) | 0] = glyph();
          var headRow = Math.floor(s.head);
          if (headRow - s.len > rows) { streams[i] = newStream(false); continue; }

          var x = (i * colW + colW / 2) * dpr;
          ctx.setTransform(RAIN.mirror ? -1 : 1, 0, 0, 1, x, 0);
          ctx.shadowBlur = 0;
          ctx.fillStyle = baseStr;
          for (var k = s.len - 1; k >= 2; k--) {
            var row = headRow - k;
            if (row < 0 || row > rows) continue;
            var a = 1 - k / s.len;
            ctx.globalAlpha = a * a * 0.9 + 0.05;
            put(s.glyphs[row], row);
          }
          if (headRow - 1 >= 0 && headRow - 1 <= rows) {
            ctx.globalAlpha = 0.95; ctx.fillStyle = neckStr; put(s.glyphs[headRow - 1], headRow - 1);
          }
          if (headRow >= 0 && headRow <= rows) {
            ctx.globalAlpha = 1; ctx.fillStyle = headStr;
            ctx.shadowColor = baseStr; ctx.shadowBlur = 8 * dpr;
            put(s.glyphs[headRow], headRow);
            ctx.shadowBlur = 0;
          }
        }
        ctx.globalAlpha = 1;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }

      resize();
      window.requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
