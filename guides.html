    <!-- Security Script (Disable Right-Click & DevTools Shortcuts) -->
    <script>
      (function() {
        'use strict';

        // Disable Right Click Context Menu
        document.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          return false;
        });

        // Disable Inspect Shortcuts
        document.addEventListener('keydown', (e) => {
          const key = e.key ? e.key.toUpperCase() : '';
          const keyCode = e.keyCode || e.which;

          if (key === 'F12' || keyCode === 123) {
            e.preventDefault();
            return false;
          }

          if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'K'].includes(key)) {
            e.preventDefault();
            return false;
          }

          if (e.ctrlKey && ['U', 'S'].includes(key)) {
            e.preventDefault();
            return false;
          }

          if (e.metaKey && e.altKey && ['I', 'J', 'C', 'U', 'S'].includes(key)) {
            e.preventDefault();
            return false;
          }
        });

        document.addEventListener('dragstart', (e) => e.preventDefault());
      })();

    <!-- UI Motion, Hardware Precision Cursor, On-Demand Loader & Zoom/Pan Controller -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // 1. Hardware Precision Calibrated Pointer (RAF Sync, 0-Lag, No CSS Transform Interpolation)
        const cursor = document.getElementById('custom-cursor');
        const cursorInner = document.getElementById('cursor-inner');

        if (cursor && window.innerWidth >= 768) {
          let mouseX = -100, mouseY = -100;

          window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
          });

          function renderCursor() {
            cursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
            requestAnimationFrame(renderCursor);
          }
          requestAnimationFrame(renderCursor);

          document.querySelectorAll('a, button, video, select, #imageWrapper, [data-cursor="true"]').forEach((el) => {
            el.addEventListener('mouseenter', () => {
              if (cursorInner) {
                cursorInner.style.width = '64px';
                cursorInner.style.height = '64px';
                cursorInner.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
              }
            });
            el.addEventListener('mouseleave', () => {
              if (cursorInner) {
                cursorInner.style.width = '42px';
                cursorInner.style.height = '42px';
                cursorInner.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
              }
            });
          });
        }

        // 2. Advanced Interactive Zoom & Pan Controller (Click, Scroll Wheel, Drag & Touch)
        const imageWrapper = document.getElementById('imageWrapper');
        const mainImage = document.getElementById('mainImage');
        
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let hasDragged = false;
        let startX = 0;
        let startY = 0;
        let initialTouchDist = 0;

        function updateTransform() {
          if (!mainImage || !imageWrapper) return;
          mainImage.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;
          
          if (scale > 1) {
            imageWrapper.style.cursor = isDragging ? 'grabbing' : 'grab';
          } else {
            imageWrapper.style.cursor = 'zoom-in';
          }
        }

        function resetZoom() {
          scale = 1;
          translateX = 0;
          translateY = 0;
          isDragging = false;
          hasDragged = false;
          updateTransform();
        }

        if (imageWrapper && mainImage) {
          // A. Click to toggle zoom
          imageWrapper.addEventListener('click', (e) => {
            if (hasDragged) return;

            if (scale > 1) {
              resetZoom();
            } else {
              scale = 2.5;
              const rect = imageWrapper.getBoundingClientRect();
              const offsetX = (e.clientX - rect.left) - rect.width / 2;
              const offsetY = (e.clientY - rect.top) - rect.height / 2;
              translateX = -offsetX * 1.5;
              translateY = -offsetY * 1.5;
              updateTransform();
            }
          });

          // B. Scroll Wheel Zooming
          imageWrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.25 : -0.25;
            const newScale = Math.min(Math.max(scale + delta, 1), 5);

            if (newScale !== scale) {
              scale = newScale;
              if (scale === 1) {
                translateX = 0;
                translateY = 0;
              }
              updateTransform();
            }
          }, { passive: false });

          // C. Mouse Drag Panning
          imageWrapper.addEventListener('mousedown', (e) => {
            if (scale <= 1) return;
            isDragging = true;
            hasDragged = false;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            updateTransform();
          });

          window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            hasDragged = true;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
          });

          window.addEventListener('mouseup', () => {
            if (isDragging) {
              isDragging = false;
              updateTransform();
            }
          });

          // D. Touch Gestures for Mobile (Pinch to Zoom & Drag to Pan)
          imageWrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1 && scale > 1) {
              isDragging = true;
              hasDragged = false;
              startX = e.touches[0].clientX - translateX;
              startY = e.touches[0].clientY - translateY;
            } else if (e.touches.length === 2) {
              isDragging = false;
              initialTouchDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
              );
            }
          }, { passive: true });

          imageWrapper.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging && scale > 1) {
              hasDragged = true;
              translateX = e.touches[0].clientX - startX;
              translateY = e.touches[0].clientY - startY;
              updateTransform();
            } else if (e.touches.length === 2 && initialTouchDist > 0) {
              const currentDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
              );
              const factor = currentDist / initialTouchDist;
              scale = Math.min(Math.max(scale * factor, 1), 5);
              initialTouchDist = currentDist;
              if (scale === 1) { translateX = 0; translateY = 0; }
              updateTransform();
            }
          }, { passive: true });

          imageWrapper.addEventListener('touchend', () => {
            isDragging = false;
          });
        }

        // 3. Strict On-Demand Lazy Media Switcher
        const mediaSelect = document.getElementById('mediaSelect');
        const mainVideo = document.getElementById('mainVideo');
        const mediaTypeLabel = document.getElementById('mediaTypeLabel');

        if (mediaSelect && mainVideo && mainImage) {
          function updateMediaDisplay() {
            resetZoom();
            
            const selectedOpt = mediaSelect.options[mediaSelect.selectedIndex];
            const mediaUrl = selectedOpt.value;
            const explicitType = selectedOpt.getAttribute('data-type');
            
            const isImage = explicitType === 'image' || (explicitType !== 'video' && mediaUrl.match(/\.(jpeg|jpg|gif|png|webp|svg)$/i));

            if (isImage) {
              mainVideo.pause();
              mainVideo.removeAttribute('src');
              mainVideo.load();
              mainVideo.classList.add('hidden');

              mainImage.src = mediaUrl;
              imageWrapper.classList.remove('hidden');
              if (mediaTypeLabel) mediaTypeLabel.textContent = 'IMAGE DISPLAY (CLICK / SCROLL TO ZOOM & PAN)';
            } else {
              imageWrapper.classList.add('hidden');
              mainImage.removeAttribute('src');

              mainVideo.src = mediaUrl;
              mainVideo.classList.remove('hidden');
              mainVideo.load();
              mainVideo.play().catch(() => {});
              if (mediaTypeLabel) mediaTypeLabel.textContent = 'MP4 MEDIA STREAM';
            }
          }

          mediaSelect.addEventListener('change', updateMediaDisplay);
          updateMediaDisplay();
        }

        // 4. Scroll Progress Bar
        const progressBar = document.getElementById('progress-bar');
        window.addEventListener('scroll', () => {
          if (progressBar) {
            const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
            const progress = totalScroll > 0 ? window.scrollY / totalScroll : 0;
            progressBar.style.transform = `scaleX(${progress})`;
          }
        });

        // 5. Mobile Menu Toggle
        const menuBtn = document.getElementById('mobile-menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuBtn && mobileMenu) {
          menuBtn.addEventListener('click', () => {
            const isHidden = mobileMenu.classList.contains('hidden');
            if (isHidden) {
              mobileMenu.classList.remove('hidden');
              menuBtn.setAttribute('aria-expanded', 'true');
            } else {
              mobileMenu.classList.add('hidden');
              menuBtn.setAttribute('aria-expanded', 'false');
            }
          });

          document.querySelectorAll('.mobile-nav-link').forEach((link) => {
            link.addEventListener('click', () => {
              mobileMenu.classList.add('hidden');
              menuBtn.setAttribute('aria-expanded', 'false');
            });
          });
        }
      });
    </script>

    <!-- Matrix Rain Script -->
    <script id="digital-rain">
    (function () {
      'use strict';
      var RAIN = { enabled: true, density: 100, speed: 100, brightness: 50, trail: 100, mirror: true };
      var COLOR = '#ffffff';
      var FONT_STACK = '"MS Gothic","Osaka-Mono","Noto Sans Mono CJK JP","Noto Sans JP","Yu Gothic","MS Mincho",monospace';
      var FONT_SIZE = 16, COL_W = 14, ROW_H = 17;

      var canvas = document.getElementById('matrixCanvas');
      var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
      if (!ctx || !RAIN.enabled) { if (canvas) canvas.style.display = 'none'; return; }
      canvas.style.opacity = String(RAIN.brightness / 100);

      function hexToRgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
      function mix(rgb, t) { return rgb.map(function (c) { return Math.round(c + (255 - c) * t); }); }
      var base = hexToRgb(COLOR);
      var baseStr = 'rgb(' + base.join(',') + ')';
      var neckStr = 'rgb(' + mix(base, 0.35).join(',') + ')';
      var headStr = 'rgb(' + mix(base, 0.85).join(',') + ')';

      var KANA = [], DIGITS = '0123456789'.split(''), SYMBOLS = ':.=*+-<>¦|'.split('');
      for (var code = 0xFF66; code <= 0xFF9D; code++) KANA.push(String.fromCharCode(code));
      function glyph() {
        var r = Math.random();
        if (r < 0.72) return KANA[(Math.random() * KANA.length) | 0];
        if (r < 0.93) return DIGITS[(Math.random() * DIGITS.length) | 0];
        return SYMBOLS[(Math.random() * SYMBOLS.length) | 0];
      }

      var stableW = 0, stableH = 0;
      function getSize() {
        var w = window.innerWidth, h = window.innerHeight;
        if (w !== stableW) { stableW = w; stableH = h; } else if (h > stableH) { stableH = h; }
        return { w: w, h: stableH };
      }

      var dpr = 1, rows = 0, colW = COL_W, streams = [], last = 0;

      function newStream(initial) {
        var len = Math.round((10 + ((Math.random() * Math.min(rows * 0.8, 34)) | 0)) * RAIN.trail / 100);
        len = Math.max(4, Math.min(len, rows + 6));
        var glyphs = [];
        for (var r = 0; r <= rows; r++) glyphs.push(glyph());
        return {
          head: initial ? Math.random() * (rows + len) - len * 0.4 : -(Math.random() * rows * 0.9),
          speed: 6 + Math.random() * 14,
          len: len, glyphs: glyphs
        };
      }

      function resize() {
        var size = getSize();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(size.w * dpr));
        canvas.height = Math.max(1, Math.round(size.h * dpr));
        rows = Math.ceil(size.h / ROW_H) + 1;
        colW = Math.min(70, Math.max(9, COL_W * 100 / RAIN.density));
        streams = [];
        for (var i = 0, cols = Math.ceil(size.w / colW); i < cols; i++) streams.push(newStream(true));
      }

      function put(ch, row) { ctx.fillText(ch, 0, row * ROW_H * dpr); }

      function frame(t) {
        window.requestAnimationFrame(frame);
        if (document.hidden || t - last < 32) return;
        var dt = Math.min((t - last) / 1000, 0.1);
        last = t;
        var size = getSize();
        if (size.w < 2 || size.h < 2) return;
        if (canvas.width !== Math.round(size.w * dpr) || canvas.height !== Math.round(size.h * dpr)) resize();

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = (FONT_SIZE * dpr) + 'px ' + FONT_STACK;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        var speedFactor = RAIN.speed / 100;

        for (var i = 0; i < streams.length; i++) {
          var s = streams[i];
          s.head += s.speed * speedFactor * dt;
          if (Math.random() < 0.3) s.glyphs[(Math.random() * s.glyphs.length) | 0] = glyph();
          var headRow = Math.floor(s.head);
          if (headRow - s.len > rows) { streams[i] = newStream(false); continue; }

          var x = (i * colW + colW / 2) * dpr;
          ctx.setTransform(RAIN.mirror ? -1 : 1, 0, 0, 1, x, 0);
          ctx.shadowBlur = 0;
          ctx.fillStyle = baseStr;
          for (var k = s.len - 1; k >= 2; k--) {
            var row = headRow - k;
            if (row < 0 || row > rows) continue;
            var a = 1 - k / s.len;
            ctx.globalAlpha = a * a * 0.9 + 0.05;
            put(s.glyphs[row], row);
          }
          if (headRow - 1 >= 0 && headRow - 1 <= rows) {
            ctx.globalAlpha = 0.95; ctx.fillStyle = neckStr; put(s.glyphs[headRow - 1], headRow - 1);
          }
          if (headRow >= 0 && headRow <= rows) {
            ctx.globalAlpha = 1; ctx.fillStyle = headStr;
            ctx.shadowColor = baseStr; ctx.shadowBlur = 8 * dpr;
            put(s.glyphs[headRow], headRow);
            ctx.shadowBlur = 0;
          }
        }
        ctx.globalAlpha = 1;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }

      resize();
      window.requestAnimationFrame(frame);
    })();
    </script>

    <!-- Login Launcher Script -->
    <script id="login-launcher">
    (function () {
      'use strict';
      var SERVER_URL = 'https://app.lawrencebauda.com';
      var WAKE_URL = 'https://wake.lawrencebauda.com/start';
      var LAUNCH_URL = 'zedserver://start';
      var CHECK_TIMEOUT_MS = 2500, WAIT_MS = 90000, POLL_MS = 2500;

      var box = document.getElementById('login-status');
      var buttons = document.querySelectorAll('[data-login]');
      var busy = false, hideTimer = 0;
      buttons.forEach(function (b) { b.setAttribute('href', SERVER_URL + '/login'); b.addEventListener('click', onLogin); });

      function show(html, kind, keep) {
        clearTimeout(hideTimer);
        box.className = 'show' + (kind ? ' ' + kind : '');
        box.innerHTML = html;
        if (!keep) hideTimer = setTimeout(function () { box.className = ''; }, 6000);
      }
      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      function isUp(timeout) {
        return new Promise(function (resolve) {
          var img = new Image(), done = false;
          function end(v) { if (!done) { done = true; clearTimeout(t); img.onload = img.onerror = null; resolve(v); } }
          var t = setTimeout(function () { end(false); }, timeout);
          img.onload = function () { end(true); };
          img.onerror = function () { end(false); };
          img.src = SERVER_URL + '/static/favicon.ico?_=' + Date.now();
        });
      }
      function protocolLaunch() {
        var a = document.createElement('a');
        a.href = LAUNCH_URL; a.style.display = 'none';
        document.body.appendChild(a); a.click(); a.remove();
      }
      function launch() {
        if (WAKE_URL) {
          try { fetch(WAKE_URL, { mode: 'no-cors', cache: 'no-store' }).catch(function () {}); } catch (e) {}
        } else {
          protocolLaunch();
        }
      }
      function go() { window.location.href = SERVER_URL + '/login'; }

      async function onLogin(e) {
        e.preventDefault();
        if (busy) return;
        busy = true;
        show('Checking server…', '', true);
        if (await isUp(CHECK_TIMEOUT_MS)) { go(); return; }

        show('Server is offline.', '', true);
        launch();
        var deadline = Date.now() + WAIT_MS;
        while (Date.now() < deadline) {
          await sleep(POLL_MS);
          if (await isUp(CHECK_TIMEOUT_MS)) { show('Server is up. Redirecting…', '', true); go(); return; }
        }
        show('Couldn’t reach the server.', 'error');
        busy = false;
      }
    })();
    </script>
