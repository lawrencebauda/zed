    <!-- UI Motion & Interactive Cursor Script -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const cursor = document.getElementById('custom-cursor');
        const cursorInner = document.getElementById('cursor-inner');

        if (cursor && window.innerWidth >= 768) {
          window.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
          });

          document.querySelectorAll('a, button, video, [data-cursor="true"]').forEach((el) => {
            el.addEventListener('mouseenter', () => {
              if (cursorInner) {
                cursorInner.style.width = '64px';
                cursorInner.style.height = '64px';
                cursorInner.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
              }
            });
            el.addEventListener('mouseleave', () => {
              if (cursorInner) {
                cursorInner.style.width = '42px';
                cursorInner.style.height = '42px';
                cursorInner.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
              }
            });
          });
        }

        const progressBar = document.getElementById('progress-bar');
        window.addEventListener('scroll', () => {
          if (progressBar) {
            const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
            const progress = totalScroll > 0 ? window.scrollY / totalScroll : 0;
            progressBar.style.transform = `scaleX(${progress})`;
          }
        });

        const menuBtn = document.getElementById('mobile-menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuBtn && mobileMenu) {
          menuBtn.addEventListener('click', () => {
            const isHidden = mobileMenu.classList.contains('hidden');
            if (isHidden) {
              mobileMenu.classList.remove('hidden');
              menuBtn.setAttribute('aria-expanded', 'true');
            } else {
              mobileMenu.classList.add('hidden');
              menuBtn.setAttribute('aria-expanded', 'false');
            }
          });

          document.querySelectorAll('.mobile-nav-link').forEach((link) => {
            link.addEventListener('click', () => {
              mobileMenu.classList.add('hidden');
              menuBtn.setAttribute('aria-expanded', 'false');
            });
          });
        }
      });
    </script>

    <script id="digital-rain">
    (function () {
      'use strict';
      var RAIN = { enabled: true, density: 100, speed: 100, brightness: 50, trail: 100, mirror: true };
      var COLOR = '#ffffff';
      var FONT_STACK = '"MS Gothic","Osaka-Mono","Noto Sans Mono CJK JP","Noto Sans JP","Yu Gothic","MS Mincho",monospace';
      var FONT_SIZE = 16, COL_W = 14, ROW_H = 17;

      var canvas = document.getElementById('matrixCanvas');
      var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
      if (!ctx || !RAIN.enabled) { if (canvas) canvas.style.display = 'none'; return; }
      canvas.style.opacity = String(RAIN.brightness / 100);

      function hexToRgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
      function mix(rgb, t) { return rgb.map(function (c) { return Math.round(c + (255 - c) * t); }); }
      var base = hexToRgb(COLOR);
      var baseStr = 'rgb(' + base.join(',') + ')';
      var neckStr = 'rgb(' + mix(base, 0.35).join(',') + ')';
      var headStr = 'rgb(' + mix(base, 0.85).join(',') + ')';

      var KANA = [], DIGITS = '0123456789'.split(''), SYMBOLS = ':.=*+-<>¦|'.split('');
      for (var code = 0xFF66; code <= 0xFF9D; code++) KANA.push(String.fromCharCode(code));
      function glyph() {
        var r = Math.random();
        if (r < 0.72) return KANA[(Math.random() * KANA.length) | 0];
        if (r < 0.93) return DIGITS[(Math.random() * DIGITS.length) | 0];
        return SYMBOLS[(Math.random() * SYMBOLS.length) | 0];
      }

      var stableW = 0, stableH = 0;
      function getSize() {
        var w = window.innerWidth, h = window.innerHeight;
        if (w !== stableW) { stableW = w; stableH = h; } else if (h > stableH) { stableH = h; }
        return { w: w, h: stableH };
      }

      var dpr = 1, rows = 0, colW = COL_W, streams = [], last = 0;

      function newStream(initial) {
        var len = Math.round((10 + ((Math.random() * Math.min(rows * 0.8, 34)) | 0)) * RAIN.trail / 100);
        len = Math.max(4, Math.min(len, rows + 6));
        var glyphs = [];
        for (var r = 0; r <= rows; r++) glyphs.push(glyph());
        return {
          head: initial ? Math.random() * (rows + len) - len * 0.4 : -(Math.random() * rows * 0.9),
          speed: 6 + Math.random() * 14,
          len: len, glyphs: glyphs
        };
      }

      function resize() {
        var size = getSize();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(size.w * dpr));
        canvas.height = Math.max(1, Math.round(size.h * dpr));
        rows = Math.ceil(size.h / ROW_H) + 1;
        colW = Math.min(70, Math.max(9, COL_W * 100 / RAIN.density));
        streams = [];
        for (var i = 0, cols = Math.ceil(size.w / colW); i < cols; i++) streams.push(newStream(true));
      }

      function put(ch, row) { ctx.fillText(ch, 0, row * ROW_H * dpr); }

      function frame(t) {
        window.requestAnimationFrame(frame);
        if (document.hidden || t - last < 32) return;
        var dt = Math.min((t - last) / 1000, 0.1);
        last = t;
        var size = getSize();
        if (size.w < 2 || size.h < 2) return;
        if (canvas.width !== Math.round(size.w * dpr) || canvas.height !== Math.round(size.h * dpr)) resize();

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = (FONT_SIZE * dpr) + 'px ' + FONT_STACK;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        var speedFactor = RAIN.speed / 100;

        for (var i = 0; i < streams.length; i++) {
          var s = streams[i];
          s.head += s.speed * speedFactor * dt;
          if (Math.random() < 0.3) s.glyphs[(Math.random() * s.glyphs.length) | 0] = glyph();
          var headRow = Math.floor(s.head);
          if (headRow - s.len > rows) { streams[i] = newStream(false); continue; }

          var x = (i * colW + colW / 2) * dpr;
          ctx.setTransform(RAIN.mirror ? -1 : 1, 0, 0, 1, x, 0);
          ctx.shadowBlur = 0;
          ctx.fillStyle = baseStr;
          for (var k = s.len - 1; k >= 2; k--) {
            var row = headRow - k;
            if (row < 0 || row > rows) continue;
            var a = 1 - k / s.len;
            ctx.globalAlpha = a * a * 0.9 + 0.05;
            put(s.glyphs[row], row);
          }
          if (headRow - 1 >= 0 && headRow - 1 <= rows) {
            ctx.globalAlpha = 0.95; ctx.fillStyle = neckStr; put(s.glyphs[headRow - 1], headRow - 1);
          }
          if (headRow >= 0 && headRow <= rows) {
            ctx.globalAlpha = 1; ctx.fillStyle = headStr;
            ctx.shadowColor = baseStr; ctx.shadowBlur = 8 * dpr;
            put(s.glyphs[headRow], headRow);
            ctx.shadowBlur = 0;
          }
        }
        ctx.globalAlpha = 1;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }

      resize();
      window.requestAnimationFrame(frame);
    })();
    </script>

    <script id="login-launcher">
    (function () {
      'use strict';
      var SERVER_URL = 'https://app.lawrencebauda.com';
      var WAKE_URL = 'https://wake.lawrencebauda.com/start';
      var LAUNCH_URL = 'zedserver://start';
      var CHECK_TIMEOUT_MS = 2500, WAIT_MS = 90000, POLL_MS = 2500;

      var box = document.getElementById('login-status');
      var buttons = document.querySelectorAll('[data-login]');
      var busy = false, hideTimer = 0;
      buttons.forEach(function (b) { b.setAttribute('href', SERVER_URL + '/login'); b.addEventListener('click', onLogin); });

      function show(html, kind, keep) {
        clearTimeout(hideTimer);
        box.className = 'show' + (kind ? ' ' + kind : '');
        box.innerHTML = html;
        if (!keep) hideTimer = setTimeout(function () { box.className = ''; }, 6000);
      }
      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      function isUp(timeout) {
        return new Promise(function (resolve) {
          var img = new Image(), done = false;
          function end(v) { if (!done) { done = true; clearTimeout(t); img.onload = img.onerror = null; resolve(v); } }
          var t = setTimeout(function () { end(false); }, timeout);
          img.onload = function () { end(true); };
          img.onerror = function () { end(false); };
          img.src = SERVER_URL + '/static/favicon.ico?_=' + Date.now();
        });
      }
      function protocolLaunch() {
        var a = document.createElement('a');
        a.href = LAUNCH_URL; a.style.display = 'none';
        document.body.appendChild(a); a.click(); a.remove();
      }
      function launch() {
        if (WAKE_URL) {
          try { fetch(WAKE_URL, { mode: 'no-cors', cache: 'no-store' }).catch(function () {}); } catch (e) {}
        } else {
          protocolLaunch();
        }
      }
      function go() { window.location.href = SERVER_URL + '/login'; }

      async function onLogin(e) {
        e.preventDefault();
        if (busy) return;
        busy = true;
        show('Checking server…', '', true);
        if (await isUp(CHECK_TIMEOUT_MS)) { go(); return; }

        show('Server is offline.', '', true);
        launch();
        var deadline = Date.now() + WAIT_MS;
        while (Date.now() < deadline) {
          await sleep(POLL_MS);
          if (await isUp(CHECK_TIMEOUT_MS)) { show('Server is up. Redirecting…', '', true); go(); return; }
        }
        show('Couldn’t reach the server.', 'error');
        busy = false;
      }
    })();
    </script>
